<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整站預覽｜SAMO TALK 薩摩白</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --paper:#FBF9F5; --ink:#221E1A; --ink-soft:#524C43; --line:#DAD3C4;
    --amber:#D98A4F; --aurora:#6C93A6; --bar-h:56px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif; background:#EDEAE2; color:var(--ink);}
  .toolbar{
    position:fixed; top:0; left:0; right:0; height:var(--bar-h); z-index:100;
    background:var(--ink); color:var(--paper); display:flex; align-items:center;
    padding:0 16px; gap:8px; overflow-x:auto; white-space:nowrap;
  }
  .toolbar .brand{font-weight:700; font-size:14px; margin-right:16px; flex:none; color:var(--paper);}
  .tab{
    background:transparent; border:1px solid #4A453C; color:#C9C4BA; font-size:13px;
    padding:7px 14px; border-radius:20px; cursor:pointer; flex:none; transition:all .15s ease;
  }
  .tab:hover{border-color:var(--amber); color:var(--paper);}
  .tab.active{background:var(--amber); border-color:var(--amber); color:var(--ink); font-weight:600;}
  .view-toggle{margin-left:auto; display:flex; gap:6px; flex:none; padding-left:16px; border-left:1px solid #4A453C;}
  .view-btn{
    background:transparent; border:1px solid #4A453C; color:#C9C4BA; font-size:12px;
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  .view-btn.active{background:var(--aurora); border-color:var(--aurora); color:#fff;}
  .stage{
    margin-top:var(--bar-h); min-height:calc(100vh - var(--bar-h));
    display:flex; align-items:flex-start; justify-content:center; padding:24px;
    transition:padding .2s ease;
  }
  .frame-wrap{
    background:#fff; box-shadow:0 8px 40px rgba(0,0,0,.12); border-radius:4px; overflow:hidden;
    transition:width .25s ease; width:100%; max-width:1280px;
  }
  .frame-wrap.mobile{width:390px; max-width:390px;}
  iframe{width:100%; height:calc(100vh - var(--bar-h) - 48px); min-height:600px; border:0; display:block; background:#fff;}
  .note{
    position:fixed; bottom:16px; right:16px; background:var(--ink); color:#C9C4BA;
    font-size:12px; padding:10px 16px; border-radius:20px; z-index:100; max-width:280px; line-height:1.6;
  }
  @media (max-width:640px){
    .note{display:none;}
    .toolbar .brand{margin-right:8px;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">SAMO TALK 預覽</span>
  <button class="tab active" data-src="index.html">首頁</button>
  <button class="tab" data-src="cases.html">個案檔案室</button>
  <button class="tab" data-src="articles.html">好文分享</button>
  <button class="tab" data-src="article-scent-memory.html">文章：氣味記憶</button>
  <button class="tab" data-src="article-territory.html">文章：地盤</button>
  <button class="tab" data-src="article-goodbye.html">文章：告別</button>
  <button class="tab" data-src="404.html">404 頁</button>
  <div class="view-toggle">
    <button class="view-btn active" data-view="desktop">桌機</button>
    <button class="view-btn" data-view="mobile">手機</button>
  </div>
</div>

<div class="stage">
  <div class="frame-wrap" id="frameWrap">
    <iframe id="previewFrame" src="index.html" title="網站預覽"></iframe>
  </div>
</div>

<div class="note">這個頁面只是給你本機檢查用的預覽工具，不需要上傳到 GitHub／不會被搜尋引擎收錄。點上方分頁切換頁面，右上角可切換手機／桌機寬度。</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const frame = document.getElementById('previewFrame');
  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      frame.src = t.dataset.src;
    });
  });
  const viewBtns = document.querySelectorAll('.view-btn');
  const wrap = document.getElementById('frameWrap');
  viewBtns.forEach(b => {
    b.addEventListener('click', () => {
      viewBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      wrap.classList.toggle('mobile', b.dataset.view === 'mobile');
    });
  });
</script>

</body>
</html>
